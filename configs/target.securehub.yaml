name: SECUREHUB

base_url: http://127.0.0.1:5002

openapi_file: securehub/openapi.yaml

allow_destructive: false

authentication:
  type: session

  login:
    method: POST
    path: /api/auth/login

    username_field: username
    password_field: password

accounts:
  - name: admin
    role: admin
    username_env: ADMIN_USERNAME
    password_env: ADMIN_PASSWORD

  - name: user
    role: user
    username_env: USER_USERNAME
    password_env: USER_PASSWORD
