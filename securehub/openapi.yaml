openapi: 3.0.3

info:
  title: SECUREHUB API
  description: API specification for the SECUREHUB Enterprise Security Portal
  version: 1.0.0

servers:
  - url: https://securehub-di8a.onrender.com
    description: SECUREHUB live server

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session

paths:

  /api/auth/login:
    post:
      summary: Login user
      description: Authenticates a user and creates a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
        "400":
          description: Username and password are required
        "401":
          description: Invalid credentials

  /api/auth/logout:
    post:
      summary: Logout user
      description: Terminates the current user session.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Logout successful

  /api/users:
    get:
      summary: Get users
      description: Returns users according to the authenticated user's role.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of users
        "401":
          description: Authentication required

  /api/orders:
    get:
      summary: Get orders
      description: Returns orders according to the authenticated user's role and ownership.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of orders
        "401":
          description: Authentication required

  /api/documents:
    get:
      summary: Get documents
      description: Returns documents according to the authenticated user's role and ownership.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of documents
        "401":
          description: Authentication required

  /api/documents/{doc_id}:
    get:
      summary: Get document
      description: Returns a specific document after an ownership or role authorization check.
      security:
        - sessionAuth: []
      parameters:
        - name: doc_id
          in: path
          required: true
          description: Document ID
          schema:
            type: integer
      responses:
        "200":
          description: Document returned successfully
        "403":
          description: Access denied
        "404":
          description: Document not found

  /api/tickets:
    get:
      summary: Get tickets
      description: Returns tickets according to the authenticated user's role and relationship to the ticket.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of tickets
        "401":
          description: Authentication required

  /api/reports:
    get:
      summary: Get reports
      description: Returns reports according to the authenticated user's role and ownership.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of reports
        "401":
          description: Authentication required

  /api/notifications:
    get:
      summary: Get current user's notifications.
      security:
        - sessionAuth: []
      responses:
        "200":
          description: List of notifications
        "401":
          description: Authentication required