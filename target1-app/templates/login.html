<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SecureLab - Access Control Security Training Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon-badge">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <h1 class="auth-title">SecureLab</h1>
                <p class="auth-subtitle">Access Control Security Training Platform</p>
                <div style="margin-top: 0.75rem;">
                    <span class="badge badge-success">
                        <span class="pulse-dot"></span>
                        Target 1: Secure Reference
                    </span>
                </div>
            </div>

            <div class="auth-body">
                <div id="login-error" class="alert alert-danger" style="display: none;"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="e.g. admin or user1" autocomplete="username" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
                    </div>

                    <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                        Sign In to SecureLab
                    </button>
                </form>

                <div class="demo-accounts-box">
                    <div class="demo-title">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Test Lab Credentials (Quick Fill)
                    </div>
                    <div class="demo-chips">
                        <button type="button" class="demo-chip" data-user="admin" data-pass="admin123">
                            <strong style="color: #fb7185;">Admin:</strong> admin / admin123
                        </button>
                        <button type="button" class="demo-chip" data-user="user1" data-pass="user123">
                            <strong style="color: #93c5fd;">User 1:</strong> user1 / user123
                        </button>
                        <button type="button" class="demo-chip" data-user="user2" data-pass="user456">
                            <strong style="color: #93c5fd;">User 2:</strong> user2 / user456
                        </button>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="/products" style="font-size: 0.8125rem; color: var(--text-muted);">
                        ← Browse Public Product Catalog
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SecureLab.initLoginPage();
        });
    </script>
</body>
</html>
